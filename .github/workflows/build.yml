name: Build

# Har push'da: testlar + Windows .exe + Android .apk yig'iladi.
# "v1.0" kabi teg qo'yilsa - fayllar avtomatik ravishda GitHub Release'ga joylanadi.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tarmoq va o'yin mantig'i testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testni kompilyatsiya qilish
        run: gcc -O2 -Wall -Wextra -Isrc tests/net_test.c src/game.c src/track.c src/net.c src/plat.c -lm -lpthread -o net_test
      - name: Testni ishga tushirish
        run: ./net_test
      - name: Parkovka testi (20 daraja yechiladi)
        run: gcc -O2 -Wall -Wextra -Isrc tests/parking_test.c src/parking.c -lm -o parking_test && ./parking_test

  windows:
    name: Windows (.exe)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64 o'rnatish
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Yig'ish
        run: |
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win --target turbojang -j4
          mkdir -p dist && cp build-win/turbojang.exe dist/TurboJang.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TurboJang-windows
          path: dist/TurboJang.exe

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK yig'ish
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Nomini o'zgartirish
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/TurboJang.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TurboJang-android
          path: dist/TurboJang.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TurboJang.exe
            dist/TurboJang.apk
