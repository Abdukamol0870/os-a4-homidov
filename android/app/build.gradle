plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.abdukamol.turbojang'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.abdukamol.turbojang'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DPLATFORM=Android'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // butun loyiha uchun umumiy CMakeLists.txt (desktop bilan bir xil kod)
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // o'rnatish oson bo'lishi uchun debug kalit bilan imzolanadi
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
